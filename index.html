<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقة الشركس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a green banner with an arc of twelve stars (the twelve tribes), then stage cards and one-question-at-a-time quiz. All type is Naskh. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --fg: #16241e;
  --muted: #566860;
  --line: #d3dcd5;
  --accent: #1f5a43;
  --accent-fg: #ffffff;
  --gold: #a8791c;
  --hero-bg: #1b4d3a;
  --hero-fg: #f4efe0;
  --hero-gold: #e0b94e;
  --good: #1d7a4a;
  --good-bg: #e0f2e8;
  --bad: #a33a2c;
  --bad-bg: #f8e3df;
  --font-naskh: "Noto Naskh Arabic", "Traditional Arabic", "Simplified Arabic", "Segoe UI", Tahoma, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1713; --surface: #16231d; --fg: #e8efe9; --muted: #9db0a5; --line: #2a3a32;
    --accent: #55b98b; --accent-fg: #08150f; --gold: #d6a944;
    --hero-bg: #12382a; --hero-fg: #f1ecdc; --hero-gold: #e0b94e;
    --good: #5cc58c; --good-bg: #17332a; --bad: #ef8a7b; --bad-bg: #3a1f1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1713; --surface: #16231d; --fg: #e8efe9; --muted: #9db0a5; --line: #2a3a32;
  --accent: #55b98b; --accent-fg: #08150f; --gold: #d6a944;
  --hero-bg: #12382a; --hero-fg: #f1ecdc; --hero-gold: #e0b94e;
  --good: #5cc58c; --good-bg: #17332a; --bad: #ef8a7b; --bad-bg: #3a1f1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-naskh); font-size: 19px; line-height: 1.95;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button { font-family: var(--font-naskh); }
.wrap { max-width: 720px; margin-inline: auto; }
.hero {
  background: var(--hero-bg); color: var(--hero-fg);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 28px max(16px, env(safe-area-inset-left, 0px)) 26px;
  text-align: center;
}
.hero svg { display: block; margin: 0 auto 6px; width: min(300px, 80%); height: auto; color: var(--hero-gold); }
.hero h1 { font-weight: 700; font-size: clamp(30px, 7.5vw, 44px); margin: 0; line-height: 1.5; text-wrap: balance; }
.hero p { margin: 4px auto 0; max-width: 34em; font-size: 18px; opacity: .92; text-wrap: balance; }
h2 { font-weight: 700; font-size: 24px; margin: 0; line-height: 1.6; }
.stages { display: grid; gap: 12px; margin-top: 22px; }
.stage {
  display: flex; gap: 14px; align-items: center; width: 100%; text-align: right;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 16px; color: inherit; font: inherit; cursor: pointer; min-width: 0;
}
.stage:hover { border-color: var(--accent); }
.stage .no { font-weight: 700; font-size: 28px; color: var(--gold); width: 1.3em; flex: none; text-align: center; }
.stage .t { flex: 1; min-width: 0; }
.stage .t b { display: block; font-weight: 700; font-size: 20px; line-height: 1.7; }
.stage .t span { color: var(--muted); font-size: 16px; line-height: 1.7; display: block; }
.stage .best { font-size: 15px; color: var(--muted); flex: none; white-space: nowrap; }
.extra { margin-top: 12px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn {
  font-weight: 700; font-size: 18px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 8px 24px;
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:hover { filter: brightness(1.08); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; font-size: 16px; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: inherit; cursor: pointer; padding: 4px 0; text-decoration: underline; }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.qcard { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 18px; }
.qcard h3 { font-weight: 700; font-size: 23px; line-height: 1.9; margin: 0 0 14px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: right; width: 100%;
  font-size: inherit; line-height: 1.8; color: inherit; background: var(--bg); border: 1.5px solid var(--line);
  border-radius: 9px; padding: 8px 14px; cursor: pointer; min-width: 0;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .l { font-weight: 700; color: var(--gold); flex: none; width: 1.3em; }
.opt .x { min-width: 0; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.fb { margin-top: 16px; padding: 12px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1.9; }
.fb strong { font-weight: 700; display: block; margin-bottom: 2px; }
.fb.ok strong { color: var(--good); }
.fb.no strong { color: var(--bad); }
.next { margin-top: 16px; display: flex; justify-content: flex-start; }
.score { text-align: center; margin-top: 26px; }
.score .n { font-weight: 700; font-size: 66px; line-height: 1.4; color: var(--accent); }
.score .n small { font-size: 28px; color: var(--muted); }
.score p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.review { margin-top: 18px; display: grid; gap: 12px; }
.review .it { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 17.5px; line-height: 1.9; }
.review .it b { font-weight: 700; display: block; margin-bottom: 4px; }
.review .it .a { color: var(--good); }
.review .it .w { color: var(--bad); }
.src { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 16px; color: var(--muted); }
.src ul { margin: 6px 0 0; padding-inline-start: 1.2em; }
.src a { color: var(--accent); overflow-wrap: anywhere; }
.credit { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); text-align: center; font-weight: 700; font-size: 18px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>
<body>
<div class="hero">
  <svg id="stars" viewBox="0 0 300 70" aria-hidden="true"></svg>
  <h1>مسابقة الشركس</h1>
  <p>مئة سؤال للتعرّف على شعب الأديغة: أصله وتاريخه وتهجيره ولغته وعاداته وحضوره في الأردن وبلاد الشام.</p>
</div>

<main class="wrap" id="app"></main>

<footer class="wrap credit">إعداد وبرمجة: وائل دهشان</footer>

<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";

/* نجوم العلم: اثنتا عشرة نجمة بعدد القبائل */
(function () {
  var svg = document.getElementById("stars"), out = "";
  function star(cx, cy, r) {
    var p = [];
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return '<polygon fill="currentColor" points="' + p.join(" ") + '"/>';
  }
  for (var k = 0; k < 12; k++) {
    var t = Math.PI * (0.12 + 0.76 * k / 11);
    out += star(150 - 130 * Math.cos(t), 62 - 52 * Math.sin(t), 6.5);
  }
  svg.innerHTML = out;
})();

/* الأسئلة: الإجابة الصحيحة هي العنصر الأول في a وتُخلط عند العرض */
var STAGES = [
  {
    title: "من هم الشركس؟",
    sub: "الاسم والموطن واللغة والعلم والقبائل",
    q: [
      { q: "ما الاسم الذي يطلقه الشركس على أنفسهم؟", a: ["أديغة", "قوقاز", "تتار", "أباظة"],
        e: "كلمة «شركس» أطلقها عليهم جيرانهم من الروس والأتراك والتتار، أما هم فيسمّون أنفسهم «أديغة»." },
      { q: "أين يقع الموطن الأصلي للشركس؟", a: ["شمال غرب القوقاز على ساحل البحر الأسود ونهر كوبان", "سهول آسيا الوسطى", "شبه جزيرة القرم", "جبال الألب"],
        e: "عاش الأديغة منذ القدم في شمال غرب القوقاز، على ضفاف نهر كوبان وساحل البحر الأسود، في ما يسمّى شركيسيا التاريخية." },
      { q: "إلى أي عائلة لغوية تنتمي اللغة الشركسية؟", a: ["القوقازية الشمالية الغربية", "الهندوأوروبية", "التركية", "السامية"],
        e: "الأديغية والقبردية والأبخازية والأبازية والأوبيخية لغات قوقازية شمالية غربية، وهي بعيدة عن الروسية والتركية والعربية." },
      { q: "ما الفرعان الرئيسان للغة الشركسية؟", a: ["الأديغية (الغربية) والقبردية (الشرقية)", "الأوسيتية والشيشانية", "الروسية والجورجية", "التترية والقرمية"],
        e: "يسمّى الفرع الأديغي أيضاً الشركسية الغربية، ويسمّى القبردي الشركسية الشرقية، وهما قريبان جداً حتى عدّهما بعضهم لهجتين للغة واحدة." },
      { q: "كم نجمة على العلم الشركسي، وماذا تمثل؟", a: ["12 نجمة تمثل 12 قبيلة", "7 نجوم تمثل 7 جبال", "9 نجوم تمثل 9 أنهار", "21 نجمة تمثل 21 معركة"],
        e: "اختار الشركس علماً فيه 12 نجمة رمزاً لوحدة قبائلهم الاثنتي عشرة، من بينها الأبزاخ والشابسوغ والقباردي والحاتقواي." },
      { q: "أيّ مما يلي من القبائل الأديغية؟", a: ["الأبزاخ", "الشيشان", "الأوسيت", "الكالميك"],
        e: "الأبزاخ من قبائل الأديغة، ومثلهم الشابسوغ والقباردي والحاتقواي والبجدوغ. أما الشيشان والأوسيت فشعبان قوقازيان آخران." },
      { q: "ما دين غالبية الشركس اليوم؟", a: ["الإسلام (سنّة)", "البوذية", "اليهودية", "المسيحية الأرثوذكسية"],
        e: "الشركس في غالبيتهم مسلمون سنّة، ويُعدّون من أقدم الشعوب التي دخلت الإسلام في أوروبا." },
      { q: "إلى أي عصر تعود حضارة مايكوب في شمال القوقاز؟", a: ["نحو 3000 قبل الميلاد", "نحو 500 ميلادية", "نحو 1500 ميلادية", "نحو 1000 قبل الميلاد"],
        e: "تدل آثار مايكوب على مجتمع متقدم عرف صناعة المعادن والفنون قبل نحو خمسة آلاف سنة في المنطقة التي سكنها الشركس." },
      { q: "ما اسم التراث الملحمي المشترك بين الشركس والأبخاز والأباظة والأوبيخ؟", a: ["ملحمة النارت", "ألف ليلة وليلة", "الشاهنامه", "ملحمة جلجامش"],
        e: "حكايات النارت أساطير وبطولات يتناقلها الشركس وجيرانهم القوقازيون، وهي من أغنى مصادر معرفة معتقداتهم القديمة." },
      { q: "أيّ مما يلي ليس من الجمهوريات الشركسية الثلاث في روسيا؟", a: ["داغستان", "أديغيا", "قباردينو بلقاريا", "قراتشاي شركيسيا"],
        e: "الجمهوريات الثلاث هي أديغيا وقباردينو بلقاريا وقراتشاي شركيسيا، أما داغستان فجمهورية أخرى في شمال القوقاز." },
      { q: "كم يُقدَّر عدد الشركس في العالم؟", a: ["نحو 5.3 ملايين نسمة", "نحو 500 ألف نسمة", "نحو 20 مليون نسمة", "نحو 50 ألف نسمة"],
        e: "تقدّر المراجع عددهم بنحو 5.3 ملايين، يعيش معظمهم خارج القوقاز، ونحو نصفهم في تركيا." },
      { q: "ما لون خلفية العلم الشركسي؟", a: ["أخضر", "أحمر", "أزرق", "أبيض"],
        e: "العلم الشركسي أخضر، عليه 12 نجمة ذهبية وثلاثة سهام ذهبية متقاطعة." },
      { q: "تمثل ثلاث من نجوم العلم القبائل «الديمقراطية»، فما هي؟", a: ["النتوخاي والشابسوغ والأبزاخ", "القباردي والبسلني والحاتقواي", "الأوبيخ والتيميرجوي والبجدوغ", "الجاني والمامخيغ واليغروقواي"],
        e: "تمثل تسع نجوم في القوس القبائل الأرستقراطية، وتمثل النجوم الثلاث الأفقية القبائل الديمقراطية: النتوخاي والشابسوغ والأبزاخ." },
      { q: "أيّ دين عرفه القوقاز قبل الإسلام، وانتشر فيه بين القرنين الثالث والخامس الميلاديين؟", a: ["المسيحية", "البوذية", "الهندوسية", "الزرادشتية وحدها"],
        e: "انتشرت المسيحية في القوقاز بين القرنين الثالث والخامس، وكان الشركس على المسيحية قبل أن يدخل الإسلام بينهم تدريجياً." },
      { q: "ما العلاقة بين الأديغية والقبردية؟", a: ["لغتان قريبتان جداً، ويراهما بعضهم لهجتين للغة واحدة", "لغتان لا تشتركان في شيء", "الأولى مشتقة من الروسية", "الثانية مشتقة من التركية"],
        e: "الأديغية هي الشركسية الغربية، والقبردية هي الشركسية الشرقية، وتتشابهان كثيراً ويفهم متكلمو إحداهما الأخرى في الغالب." },
      { q: "أيّ لغتين من العائلة نفسها أبعد قرابة بالأديغية من القبردية؟", a: ["الأبخازية والأبازية", "الروسية والأوكرانية", "التركية والأذرية", "الفارسية والكردية"],
        e: "الأبخازية والأبازية والأوبيخية من العائلة القوقازية الشمالية الغربية نفسها، لكنها أبعد من القبردية عن الأديغية." },
      { q: "ما عاصمة جمهورية أديغيا؟", a: ["مايكوب", "نالتشيك", "تشيركيسك", "سوتشي"],
        e: "مايكوب هي عاصمة أديغيا، وقد اشتهرت باسمها حضارة مايكوب القديمة. ونالتشيك عاصمة قباردينو بلقاريا، وتشيركيسك عاصمة قراتشاي شركيسيا." },
      { q: "ما عاصمة جمهورية قباردينو بلقاريا؟", a: ["نالتشيك", "مايكوب", "غروزني", "ماخاتشكالا"],
        e: "نالتشيك هي عاصمة قباردينو بلقاريا حيث يعيش القباردي، وهم الفرع الشرقي من الشركس." },
      { q: "كم سجّل تعداد روسيا عام 2021 من الشركس تقريباً؟", a: ["نحو 751 ألفاً", "نحو 75 ألفاً", "نحو 7.5 ملايين", "نحو مليونين"],
        e: "سجّل التعداد الروسي لعام 2021 نحو 751 ألف شركسي، وهم أقل بكثير ممن يعيشون في الشتات." },
      { q: "أيّ بحرين يحدّان القوقاز من الغرب والشرق؟", a: ["الأسود وقزوين", "المتوسط والأحمر", "البلطيق وبحر الشمال", "الأدرياتيكي وإيجة"],
        e: "يمتد القوقاز بين البحر الأسود غرباً وبحر قزوين شرقاً، وتحدّه روسيا من الشمال وتركيا من الجنوب." }
    ]
  },
  {
    title: "الحرب والتهجير",
    sub: "من 1763 إلى 1864 وما بعدها",
    q: [
      { q: "كم سنة استمرت الحرب الروسية القوقازية بين 1763 و1864؟", a: ["101 سنة", "25 سنة", "50 سنة", "200 سنة"],
        e: "عُرفت بحرب المئة عام وعام، وصُنّفت من أطول الحروب وأكثرها دموية، وقُدّر ضحاياها بمئات الآلاف من سكان القوقاز." },
      { q: "في أي عام انتهت المقاومة الشركسية وبدأ التهجير الجماعي؟", a: ["1864", "1798", "1917", "1948"],
        e: "انتهت المقاومة الشركسية في منطقة قبادا عام 1864، وبدأ التهجير قبل ذلك التاريخ واكتمل معظمه بحلول 1867." },
      { q: "ماذا يمثّل يوم 21 أيار (مايو) عند الشركس؟", a: ["يوم الحزن أو الحداد الشركسي", "عيد الربيع", "يوم اللغة الأم", "عيد الحصاد"],
        e: "يحيي الشركس حول العالم في هذا اليوم ذكرى انتهاء الحرب وبدء هجرتهم الجماعية من القوقاز عام 1864." },
      { q: "إلى أين اتجه معظم الشركس المهجَّرين؟", a: ["أراضي الدولة العثمانية", "الصين", "البرازيل", "إيران فقط"],
        e: "نُقل المهجَّرون عبر موانئ البحر الأسود إلى الأناضول والبلقان، ثم استقر بعضهم في بلاد الشام ومنها الأردن وسوريا وفلسطين ولبنان." },
      { q: "ما نسبة الشركس الذين يعيشون اليوم خارج وطنهم الأصلي؟", a: ["الغالبية العظمى (نحو 80% فأكثر)", "أقل من 10%", "نحو 25%", "نحو النصف"],
        e: "تشير التقديرات إلى أن نحو 80% من الشركس، وبعض التقديرات تقول 90%، يعيشون في الشتات، وأكبر تجمعاتهم في تركيا." },
      { q: "لماذا أثارت أولمبياد سوتشي 2014 احتجاج الشركس؟", a: ["لأنها أُقيمت على أرض ارتبطت بتهجيرهم قبل 150 عاماً", "لأنها منعت لغتهم", "لأنها أُقيمت في الأردن", "لأنها ألغت علمهم"],
        e: "جاءت الألعاب في الذكرى الـ150 لتهجير 1864، وفي منطقة تاريخية للشركس،
