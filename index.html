<title>مسابقة الشركس</title>

<style>
/* Layout: a green banner with an arc of twelve stars (the twelve tribes), then stage cards and one-question-at-a-time quiz. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --fg: #16241e;
  --muted: #566860;
  --line: #d3dcd5;
  --accent: #1f5a43;
  --accent-fg: #ffffff;
  --gold: #a8791c;
  --hero-bg: #1b4d3a;
  --hero-fg: #f4efe0;
  --hero-gold: #e0b94e;
  --good: #1d7a4a;
  --good-bg: #e0f2e8;
  --bad: #a33a2c;
  --bad-bg: #f8e3df;
  --font-display: "Reem Kufi", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1713; --surface: #16231d; --fg: #e8efe9; --muted: #9db0a5; --line: #2a3a32;
    --accent: #55b98b; --accent-fg: #08150f; --gold: #d6a944;
    --hero-bg: #12382a; --hero-fg: #f1ecdc; --hero-gold: #e0b94e;
    --good: #5cc58c; --good-bg: #17332a; --bad: #ef8a7b; --bad-bg: #3a1f1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1713; --surface: #16231d; --fg: #e8efe9; --muted: #9db0a5; --line: #2a3a32;
  --accent: #55b98b; --accent-fg: #08150f; --gold: #d6a944;
  --hero-bg: #12382a; --hero-fg: #f1ecdc; --hero-gold: #e0b94e;
  --good: #5cc58c; --good-bg: #17332a; --bad: #ef8a7b; --bad-bg: #3a1f1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 18px; line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 720px; margin-inline: auto; }
.hero {
  background: var(--hero-bg); color: var(--hero-fg);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 28px max(16px, env(safe-area-inset-left, 0px)) 26px;
  text-align: center;
}
.hero svg { display: block; margin: 0 auto 6px; width: min(300px, 80%); height: auto; color: var(--hero-gold); }
.hero h1 { font-family: var(--font-display); font-size: clamp(28px, 7vw, 40px); margin: 0; line-height: 1.4; text-wrap: balance; }
.hero p { margin: 6px auto 0; max-width: 34em; font-size: 17px; opacity: .9; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.5; }
.stages { display: grid; gap: 12px; margin-top: 22px; }
.stage {
  display: flex; gap: 14px; align-items: center; width: 100%; text-align: right;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; color: inherit; font: inherit; cursor: pointer; min-width: 0;
}
.stage:hover { border-color: var(--accent); }
.stage .no { font-family: var(--font-display); font-size: 26px; color: var(--gold); width: 1.4em; flex: none; text-align: center; }
.stage .t { flex: 1; min-width: 0; }
.stage .t b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.stage .t span { color: var(--muted); font-size: 15.5px; }
.stage .best { font-size: 14.5px; color: var(--muted); flex: none; white-space: nowrap; }
.all { margin-top: 12px; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn {
  font: inherit; font-family: var(--font-display); font-size: 17px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 10px 22px;
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:hover { filter: brightness(1.08); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; font-size: 15.5px; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 4px 0; text-decoration: underline; }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.qcard { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 18px; }
.qcard h3 { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1.7; margin: 0 0 16px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: right; width: 100%;
  font: inherit; color: inherit; background: var(--bg); border: 1.5px solid var(--line);
  border-radius: 9px; padding: 10px 14px; cursor: pointer; min-width: 0;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .l { font-family: var(--font-display); color: var(--gold); flex: none; width: 1.3em; }
.opt .x { min-width: 0; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.fb { margin-top: 16px; padding: 12px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 17px; }
.fb strong { font-family: var(--font-display); display: block; margin-bottom: 2px; }
.fb.ok strong { color: var(--good); }
.fb.no strong { color: var(--bad); }
.next { margin-top: 16px; display: flex; justify-content: flex-start; }
.score { text-align: center; margin-top: 26px; }
.score .n { font-family: var(--font-display); font-size: 64px; line-height: 1.2; color: var(--accent); }
.score .n small { font-size: 26px; color: var(--muted); }
.score p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.review { margin-top: 26px; display: grid; gap: 12px; }
.review .it { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16.5px; }
.review .it b { font-family: var(--font-display); font-weight: 500; display: block; margin-bottom: 4px; }
.review .it .a { color: var(--good); }
.review .it .w { color: var(--bad); }
.src { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 15px; color: var(--muted); }
.src ul { margin: 6px 0 0; padding-inline-start: 1.2em; }
.src a { color: var(--accent); overflow-wrap: anywhere; }
.credit { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); text-align: center; font-family: var(--font-display); font-size: 17px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>
<body>
<div class="hero">
  <svg id="stars" viewBox="0 0 300 70" aria-hidden="true"></svg>
  <h1>مسابقة الشركس</h1>
  <p>ثلاثون سؤالاً للتعرّف على شعب الأديغة: أصله وتاريخه وتهجيره ولغته وعاداته وحضوره في الأردن.</p>
</div>

<main class="wrap" id="app"></main>

<footer class="wrap credit">إعداد وبرمجة: وائل دهشان</footer>

<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";

/* نجوم العلم: اثنتا عشرة نجمة بعدد القبائل */
(function () {
  var svg = document.getElementById("stars"), out = "";
  function star(cx, cy, r) {
    var p = [];
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return '<polygon fill="currentColor" points="' + p.join(" ") + '"/>';
  }
  for (var k = 0; k < 12; k++) {
    var t = Math.PI * (0.12 + 0.76 * k / 11);
    out += star(150 - 130 * Math.cos(t), 62 - 52 * Math.sin(t), 6.5);
  }
  svg.innerHTML = out;
})();

/* الأسئلة: الإجابة الصحيحة هي العنصر الأول في a وتُخلط عند العرض */

        e: "كُتبت الأديغية قديماً بحروف عربية ولاتينية، ثم اعتُمد الحرف الكيريلي رسمياً عام 1936." },
      { q: "كم يبلغ تقريباً عدد الأصوات الساكنة في اللهجات الأديغية؟", a: ["بين 50 و60 صوتاً", "بين 15 و20", "بين 24 و28", "أكثر من 100"],
        e: "تتميز الأديغية بعدد كبير من الأصوات الساكنة يتراوح بين خمسين وستين بحسب اللهجة، وهذا ما يجعلها صعبة على متعلميها." },
      { q: "من مؤسس دولة المماليك الشراكسة (البرجية) في مصر والشام؟", a: ["الظاهر برقوق", "الظاهر بيبرس", "المنصور قلاوون", "صلاح الدين الأيوبي"],
        e: "تولى برقوق السلطنة عام 1382م (784هـ)، وحكم المماليك الشراكسة مصر والشام حتى الفتح العثماني عام 1517م." },
      { q: "ما المهمة المعروفة للحرس الشركسي في الأردن؟", a: ["حراسة الملك", "حرس الحدود فقط", "إدارة الموانئ", "حراسة المساجد"],
        e: "اشتهر الشركس في الأردن بالخدمة في الجيش والأمن، ومنها الحرس الملكي الشركسي المكلف بحراسة الملك." },
      { q: "كم يُقدَّر عدد الشركس في الأردن؟", a: ["بين 100 و170 ألفاً", "نحو 5 آلاف", "نحو 20 ألفاً", "نحو 3 ملايين"],
        e: "تتفاوت التقديرات لعدم وجود إحصاء رسمي بحسب الأصل، وهم يتكلمون الشركسية والعربية الأردنية، وجمعيات ثقافية تحافظ على تراثهم." }
    ]
  }
];

var KEY = "circassian-quiz-best";
var app = document.getElementById("app");
var LET = ["أ", "ب", "ج", "د"];
var state = null;

function getBest() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function setBest(i, s) {
  try { var b = getBest(); if (b[i] == null || s > b[i]) { b[i] = s; localStorage.setItem(KEY, JSON.stringify(b)); } } catch (e) {}
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function home() {
  state = null;
  var best = getBest(), h = '<div class="stages">';
  STAGES.forEach(function (s, i) {
    h += '<button class="stage" data-stage="' + i + '"><span class="no">' + (i + 1) + '</span>' +
      '<span class="t"><b>' + s.title + '</b><span>' + s.sub + '</span></span>' +
      '<span class="best">' + (best[i] != null ? "أفضل نتيجة " + best[i] + "/10" : "10 أسئلة") + '</span></button>';
  });
  h += '</div><div class="all"><button class="stage" data-stage="all"><span class="no">★</span>' +
    '<span class="t"><b>المسابقة الكاملة</b><span>ثلاثون سؤالاً مخلوطة من المراحل الثلاث</span></span>' +
    '<span class="best">30 سؤالاً</span></button></div>';
  h += '<div class="src"><b>المصادر</b><ul>' +
    '<li><a href="https://arabicpost.net/%d8%ab%d9%82%d8%a7%d9%81%d8%a9/2018/09/23/%d8%b1%d8%ba%d9%85-%d8%a7%d9%84%d8%ad%d8%b1%d9%88%d8%a8-%d9%88%d8%a7%d9%84%d9%86%d8%b2%d9%88%d8%ad%d8%8c-%d9%81%d8%a5%d9%86%d9%87%d9%85-%d9%85%d8%aa%d9%85%d8%b3%d9%83%d9%88%d9%86-%d8%a8%d8%a7%d9%84/" target="_blank" rel="noopener">عربي بوست: الأديغة خابزة</a></li>' +
    '<li><a href="https://www.enabbaladi.net/406667/" target="_blank" rel="noopener">عنب بلدي: كيف حافظ شركس سوريا على موروثهم</a></li>' +
    '<li><a href="https://www.enabbaladi.net/303229" target="_blank" rel="noopener">عنب بلدي: شركس سوريا، قومية جامعة وهوية متجددة</a></li>' +
    '<li><a href="https://www.ajnet.me/encyclopedia/2016/5/29/تهجير-الشركس-من-القوقاز-جريمة" target="_blank" rel="noopener">الجزيرة: تهجير الشركس من القوقاز</a></li>' +
    '<li><a href="https://www.ajnet.me/culture/2026/7/26/حارس-التراث-الشركسي-عدنان-بزادوغ" target="_blank" rel="noopener">الجزيرة: حارس التراث الشركسي</a></li>' +
    '<li><a href="https://en.wikipedia.org/wiki/Circassians_in_Jordan" target="_blank" rel="noopener">Wikipedia: Circassians in Jordan</a></li>' +
    '<li><a href="https://en.wikipedia.org/wiki/Adyghe_Xabze" target="_blank" rel="noopener">Wikipedia: Adyghe Khabze</a></li>' +
    '<li><a href="https://en.wikipedia.org/wiki/Adyghe_language" target="_blank" rel="noopener">Wikipedia: Adyghe language</a></li>' +
    '</ul></div>';
  app.innerHTML = h;
  Array.prototype.forEach.call(app.querySelectorAll("[data-stage]"), function (b) {
    b.addEventListener("click", function () { start(b.getAttribute("data-stage")); });
  });
}

function start(which) {
  var qs = [];
  if (which === "all") { STAGES.forEach(function (s) { qs = qs.concat(s.q); }); qs = shuffle(qs); }
  else { qs = shuffle(STAGES[+which].q); }
  state = { which: which, qs: qs, i: 0, score: 0, wrong: [] };
  question();
}

function question() {
  var q = state.qs[state.i], total = state.qs.length;
  var opts = shuffle(q.a.map(function (t, k) { return { t: t, ok: k === 0 }; }));
  state.cur = { opts: opts, done: false };
  var h = '<div class="top"><button class="linkbtn" id="back">الرئيسية</button><span>السؤال ' + (state.i + 1) + ' من ' + total + '</span></div>' +
    '<div class="bar"><i style="width:' + (state.i / total * 100) + '%"></i></div>' +
    '<div class="qcard"><h3>' + esc(q.q) + '</h3><div class="opts">';
  opts.forEach(function (o, k) {
    h += '<button class="opt" data-k="' + k + '"><span class="l">' + LET[k] + '</span><span class="x">' + esc(o.t) + '</span></button>';
  });
  h += '</div><div id="fb"></div></div>';
  app.innerHTML = h;
  document.getElementById("back").addEventListener("click", home);
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
    b.addEventListener("click", function () { answer(+b.getAttribute("data-k")); });
  });
}

function answer(k) {
  if (state.cur.done) return;
  state.cur.done = true;
  var q = state.qs[state.i], o = state.cur.opts[k], right = o.ok;
  var btns = app.querySelectorAll(".opt");
  Array.prototype.forEach.call(btns, function (b, j) {
    b.disabled = true;
    if (state.cur.opts[j].ok) b.classList.add("ok");
    else if (j === k) b.classList.add("no");
  });
  if (right) state.score++; else state.wrong.push({ q: q.q, mine: o.t, right: q.a[0], e: q.e });
  var last = state.i === state.qs.length - 1;
  document.getElementById("fb").innerHTML =
    '<div class="fb ' + (right ? "ok" : "no") + '"><strong>' + (right ? "إجابة صحيحة" : "إجابة غير صحيحة") + '</strong>' + esc(q.e) + '</div>' +
    '<div class="next"><button class="btn" id="nx">' + (last ? "عرض النتيجة" : "السؤال التالي") + '</button></div>';
  var nx = document.getElementById("nx");
  nx.addEventListener("click", function () { if (last) result(); else { state.i++; question(); window.scrollTo(0, 0); } });
  nx.focus({ preventScroll: false });
}

function result() {
  var total = state.qs.length, s = state.score, pct = s / total;
  if (state.which !== "all") setBest(+state.which, s);
  var msg = pct >= 0.9 ? "ممتاز، أنت على معرفة واسعة بالشعب الشركسي." :
            pct >= 0.7 ? "جيد جداً، بقيت أمور قليلة تستحق المراجعة." :
            pct >= 0.5 ? "جيد، راجع الشروح أدناه ثم أعد المحاولة." :
            "ابدأ بقراءة الشروح أدناه ثم أعد المحاولة، فالمعلومات ستثبت سريعاً.";
  var h = '<div class="score"><div class="n">' + s + '<small> / ' + total + '</small></div><p>' + msg + '</p></div>' +
    '<div class="actions"><button class="btn" id="again">أعد المرحلة</button><button class="btn ghost" id="home">الرئيسية</button></div>';
  if (state.wrong.length) {
    h += '<h2 style="margin-top:28px">ما أخطأت فيه</h2><div class="review">';
    state.wrong.forEach(function (w) {
      h += '<div class="it"><b>' + esc(w.q) + '</b><div class="w">إجابتك: ' + esc(w.mine) + '</div><div class="a">الصحيح: ' + esc(w.right) + '</div><div>' + esc(w.e) + '</div></div>';
    });
    h += '</div>';
  }
  app.innerHTML = h;
  document.getElementById("again").addEventListener("click", function () { start(state.which); window.scrollTo(0, 0); });
  document.getElementById("home").addEventListener("click", function () { home(); window.scrollTo(0, 0); });
  window.scrollTo(0, 0);
}

home();
</script>

</body>
</html>
